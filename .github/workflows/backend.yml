name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_cleardocs
          POSTGRES_USER: cleardocs
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r backend/requirements/development.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Format check (black)
        run: black --check backend/

      - name: Type check (mypy)
        run: mypy backend/ --ignore-missing-imports

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_DB: test_cleardocs
          POSTGRES_USER: cleardocs
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        working-directory: backend
        run: pytest --cov=. --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cleardocs-backend:${{ github.sha }} ./backend
