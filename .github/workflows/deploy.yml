name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running deploy

env:
  AWS_REGION: us-east-1
  BACKEND_ECR_REPO: cleardocs-backend
  FRONTEND_ECR_REPO: cleardocs-frontend
  ECS_CLUSTER: cleardocs-prod

# ── Backend tests ──────────────────────────────────────────────────────────────
jobs:
  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_cleardocs
          POSTGRES_USER: cleardocs
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r backend/requirements/development.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Format check (black)
        run: black --check backend/

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_DB: test_cleardocs
          POSTGRES_USER: cleardocs
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest --tb=short -q --cov=. --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

# ── Frontend build check ───────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.cleardocs.app/api/v1
          NEXT_PUBLIC_WS_URL: wss://api.cleardocs.app
        run: npm run build

# ── Deploy ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    environment: production

    # Skippable tests flow: if tests are skipped the needs list must be satisfied
    # differently. GitHub Actions doesn't support conditional needs, so we guard
    # this with the workflow_dispatch skip_tests input at the job level.
    if: always() && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & push images ────────────────────────────────────────────────

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --target production \
            -t $ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }} \
            -t $ECR_REGISTRY/$BACKEND_ECR_REPO:latest \
            ./backend
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }}
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPO:latest
          echo "BACKEND_IMAGE=$ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --target production \
            --build-arg NEXT_PUBLIC_API_URL=https://api.cleardocs.app/api/v1 \
            --build-arg NEXT_PUBLIC_WS_URL=wss://api.cleardocs.app \
            -t $ECR_REGISTRY/$FRONTEND_ECR_REPO:${{ github.sha }} \
            -t $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest \
            ./frontend
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPO:${{ github.sha }}
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest
          echo "FRONTEND_IMAGE=$ECR_REGISTRY/$FRONTEND_ECR_REPO:${{ github.sha }}" >> $GITHUB_ENV

      # ── Database migrations (run as one-off Fargate task) ─────────────────

      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition cleardocs-api \
            --overrides "{\"containerOverrides\":[{\"name\":\"api\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

      # ── Update API task definition and deploy ─────────────────────────────

      - name: Deploy API service
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition cleardocs-api \
            --query 'taskDefinition' \
            --output json | jq \
            --arg IMAGE "$BACKEND_IMAGE" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE')

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service cleardocs-api \
            --task-definition "$NEW_REVISION" \
            --force-new-deployment

      # ── Update Worker task definition and deploy ───────────────────────────

      - name: Deploy Worker service
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition cleardocs-worker \
            --query 'taskDefinition' \
            --output json | jq \
            --arg IMAGE "$BACKEND_IMAGE" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE')

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service cleardocs-worker \
            --task-definition "$NEW_REVISION" \
            --force-new-deployment

      # ── Update Beat task definition and deploy ────────────────────────────

      - name: Deploy Beat service
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition cleardocs-beat \
            --query 'taskDefinition' \
            --output json | jq \
            --arg IMAGE "$BACKEND_IMAGE" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE')

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service cleardocs-beat \
            --task-definition "$NEW_REVISION" \
            --force-new-deployment

      # ── Wait for stable deployment ─────────────────────────────────────────

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services cleardocs-api cleardocs-worker cleardocs-beat

      # ── Smoke test ─────────────────────────────────────────────────────────

      - name: Health check
        run: |
          curl --retry 6 --retry-delay 10 --retry-connrefused \
               --fail --silent --show-error \
               https://api.cleardocs.app/health/ready/
          echo "Deployment healthy."

      # ── Rollback on failure ────────────────────────────────────────────────

      - name: Rollback API service on failure
        if: failure()
        run: |
          echo "Rolling back API service to previous task definition..."
          PREV_DEF=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services cleardocs-api \
            --query 'services[0].deployments[?status==`ACTIVE`].taskDefinition | [0]' \
            --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service cleardocs-api \
            --task-definition "$PREV_DEF"
