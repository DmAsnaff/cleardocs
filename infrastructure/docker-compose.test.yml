version: "3.9"

services:
  postgres_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: test_cleardocs
      POSTGRES_USER: cleardocs
      POSTGRES_PASSWORD: testpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleardocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend_test:
    build:
      context: ../backend
      target: development
    command: pytest --cov=. --cov-report=xml --cov-fail-under=80
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: test_cleardocs
      POSTGRES_USER: cleardocs
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: postgres_test
      REDIS_URL: redis://redis_test:6379/0
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
